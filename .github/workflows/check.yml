name: Sjekk Hertz Freerider

on:
  schedule:
    # Hvert 30. minutt. Justér her hvis du vil ha det oftere/sjeldnere.
    - cron: "*/30 * * * *"
  workflow_dispatch:  # Lar deg trigge manuelt fra GitHub-grensesnittet

permissions:
  contents: write

concurrency:
  group: hertz-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør sjekk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_routes.py

      - name: Lagre tilstand
        run: |
          if [[ -n "$(git status --porcelain seen_trips.json heartbeat.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_trips.json heartbeat.json
            git commit -m "Oppdater tilstand [skip ci]"
            git push
          else
            echo "Ingen endringer i tilstandsfiler"
          fi
