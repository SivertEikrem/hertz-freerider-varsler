name: Sjekk Hertz Freerider

on:
  schedule:
    # Kjører hvert 30. minutt. GitHub garanterer ikke eksakt timing,
    # så det kan ta noen minutter ekstra i perioder med mye trafikk.
    - cron: "*/30 * * * *"
  workflow_dispatch: # gjør at du også kan trigge den manuelt fra GitHub

permissions:
  contents: write # trengs for å kunne committe seen.json tilbake

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør sjekk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Lagre oppdatert tilstand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Oppdater sette turer [skip ci]"
          git push
