<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Returbil — ledige turer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E141B;
    --surface:#161F29;
    --surface-2:#1C2732;
    --border:#26333F;
    --text:#ECEFF3;
    --text-muted:#8A96A6;
    --text-faint:#59636F;
    --accent:#2E7FE0;
    --accent-dim:#1C3A5C;
    --amber:#E8A93B;
    --red:#E0654F;
    --hertz:#4C8DFF;
    --hjemferd:#43C98A;
    --leiebilretur:#E8935B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:48px;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(14,20,27,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 16px 12px;
  }
  .titlebar{
    display:flex; align-items:baseline; justify-content:space-between;
    max-width:640px; margin:0 auto;
  }
  .titlebar h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.02em;
    margin:0;
    text-transform:uppercase;
  }
  .titlebar h1 .sub{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13px;
    color:var(--text-muted);
    text-transform:none;
    letter-spacing:0;
    margin-left:8px;
  }
  .status{
    display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    white-space:nowrap;
  }
  .status .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-faint);
    flex-shrink:0;
  }
  .status.fresh .dot{ background:var(--hjemferd); box-shadow:0 0 6px var(--hjemferd); }
  .status.stale .dot{ background:var(--amber); }

  /* ---------- Filters ---------- */
  .filters{
    position:sticky; top:57px; z-index:19;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
  }
  .filters-inner{ max-width:640px; margin:0 auto; }
  .filter-row{
    display:flex; gap:8px; margin-bottom:8px;
  }
  .filter-row:last-child{ margin-bottom:0; }
  select{
    flex:1; min-width:0;
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:9px 10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%238A96A6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 12px center;
    padding-right:28px;
  }
  select:focus, .chip:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    border-radius:999px;
    padding:6px 12px;
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .chip .swatch{ width:7px; height:7px; border-radius:50%; }
  .chip.active{
    color:var(--text);
    border-color:transparent;
  }
  .chip[data-source="Hertz"].active{ background:rgba(76,141,255,0.16); border-color:var(--hertz); }
  .chip[data-source="Hjemferd"].active{ background:rgba(67,201,138,0.16); border-color:var(--hjemferd); }
  .chip[data-source="Leiebilretur"].active{ background:rgba(232,147,91,0.16); border-color:var(--leiebilretur); }
  .chip.reset{ margin-left:auto; color:var(--text-faint); }
  .chip.reset:hover{ color:var(--text-muted); }

  /* ---------- List ---------- */
  main{ max-width:640px; margin:0 auto; padding:16px; }
  .count-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    margin:0 4px 14px;
  }
  .count-line b{ color:var(--text-muted); font-weight:500; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:10px;
    padding:14px 14px 12px;
    position:relative;
    overflow:hidden;
    animation:rise .35s ease backwards;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
  }
  .card[data-source="Hertz"]::before{ background:var(--hertz); }
  .card[data-source="Hjemferd"]::before{ background:var(--hjemferd); }
  .card[data-source="Leiebilretur"]::before{ background:var(--leiebilretur); }

  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:10px;
  }
  .source-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .deadline-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
  }
  .deadline-tag.urgent{ color:var(--amber); }

  /* Route line — signature element */
  .route{
    display:flex; align-items:center; gap:0;
    margin-bottom:12px;
  }
  .route .stop{
    flex:0 0 auto; max-width:38%;
  }
  .route .stop-label{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:16px;
    line-height:1.15;
    text-transform:uppercase;
    letter-spacing:0.01em;
    word-break:break-word;
  }
  .route .stop.to .stop-label{ text-align:right; }
  .route .line{
    flex:1 1 auto;
    height:2px;
    margin:0 8px;
    position:relative;
    background:repeating-linear-gradient(to right, var(--border) 0, var(--border) 5px, transparent 5px, transparent 10px);
    min-width:20px;
  }
  .route .line::before, .route .line::after{
    content:""; position:absolute; top:50%; width:6px; height:6px;
    border-radius:50%; background:var(--text-muted);
    transform:translateY(-50%);
  }
  .route .line::before{ left:-2px; }
  .route .line::after{ right:-2px; }
  .route .line .arrow{
    position:absolute; right:0; top:50%; transform:translate(2px,-50%);
    border-top:4px solid transparent; border-bottom:4px solid transparent;
    border-left:6px solid var(--text-muted);
  }

  .meta{
    display:flex; flex-wrap:wrap; gap:6px 14px;
    font-size:12.5px; color:var(--text-muted);
  }
  .meta .item{ display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .meta .item b{ color:var(--text); font-weight:500; }
  .meta .neg{ color:var(--text-faint); }

  .card-bottom{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; padding-top:10px; border-top:1px solid var(--border);
  }
  .book-link{
    font-size:12.5px; font-weight:600; color:var(--accent);
    text-decoration:none;
    display:flex; align-items:center; gap:4px;
  }
  .book-link:hover{ text-decoration:underline; }
  .fee{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--text-faint);
  }

  /* ---------- Empty / loading ---------- */
  .empty{
    text-align:center;
    padding:56px 20px;
    color:var(--text-muted);
  }
  .empty .big{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:20px; text-transform:uppercase;
    color:var(--text); margin-bottom:6px;
  }
  .empty .small{ font-size:13px; color:var(--text-faint); max-width:320px; margin:0 auto; }
  .empty button{
    margin-top:16px;
    background:var(--accent-dim); color:var(--accent);
    border:1px solid var(--accent); border-radius:999px;
    padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>Returbil<span class="sub">ledige turer</span></h1>
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="status-text">laster …</span>
    </div>
  </div>
</header>

<div class="filters">
  <div class="filters-inner">
    <div class="filter-row">
      <select id="from-select" aria-label="Fra">
        <option value="">Fra — alle steder</option>
      </select>
      <select id="to-select" aria-label="Til">
        <option value="">Til — alle steder</option>
      </select>
    </div>
    <div class="filter-row chips" id="source-chips">
      <button class="chip active" data-source="Hertz"><span class="swatch" style="background:#4C8DFF"></span>Hertz</button>
      <button class="chip active" data-source="Hjemferd"><span class="swatch" style="background:#43C98A"></span>Hjemferd</button>
      <button class="chip active" data-source="Leiebilretur"><span class="swatch" style="background:#E8935B"></span>Leiebilretur</button>
      <button class="chip reset" id="reset-btn">Nullstill</button>
    </div>
  </div>
</div>

<main>
  <p class="count-line" id="count-line"></p>
  <div id="list"></div>
</main>

<script>
const state = { trips: [], from: "", to: "", sources: new Set(["Hertz","Hjemferd","Leiebilretur"]) };

function parseDate(str){
  // format "dd.mm.yyyy HH:MM"
  if(!str) return null;
  const m = str.match(/(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
}

function fmtRelative(iso){
  const d = new Date(iso);
  const diffMin = Math.round((Date.now() - d.getTime())/60000);
  if(diffMin < 1) return "akkurat nå";
  if(diffMin < 60) return `${diffMin} min siden`;
  const h = Math.floor(diffMin/60), m = diffMin%60;
  return `${h}t ${m}min siden`;
}

function populateSelects(trips){
  const froms = [...new Set(trips.map(t => t.from_loc).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nb'));
  const tos   = [...new Set(trips.map(t => t.to_loc).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nb'));
  const fromSel = document.getElementById('from-select');
  const toSel   = document.getElementById('to-select');
  for(const f of froms){
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    fromSel.appendChild(opt);
  }
  for(const t of tos){
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    toSel.appendChild(opt);
  }
}

function render(){
  const list = document.getElementById('list');
  const countLine = document.getElementById('count-line');

  let filtered = state.trips.filter(t =>
    state.sources.has(t.source) &&
    (!state.from || t.from_loc === state.from) &&
    (!state.to   || t.to_loc === state.to)
  );

  filtered.sort((a,b) => {
    const da = parseDate(a.available_from), db = parseDate(b.available_from);
    if(da && db) return da - db;
    if(da) return -1;
    if(db) return 1;
    return 0;
  });

  countLine.innerHTML = `<b>${filtered.length}</b> av ${state.trips.length} tur(er) vises`;

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="big">Ingen treff</div>
        <div class="small">Ingen ledige turer matcher filteret akkurat nå. Prøv å velge et annet sted, eller nullstill filteret.</div>
        <button onclick="resetFilters()">Nullstill filter</button>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(cardHtml).join("");
}

function cardHtml(t){
  const now = new Date();
  const deadline = parseDate(t.deadline);
  const urgent = deadline && (deadline - now) < 48*3600*1000;

  const metaItems = [];
  if(t.vehicle) metaItems.push(`<span class="item">🚙 <b>${esc(t.vehicle)}</b></span>`);
  if(t.seats) metaItems.push(`<span class="item">💺 <b>${t.seats}</b> seter</span>`);
  if(t.fuel_included !== null && t.fuel_included !== undefined){
    metaItems.push(t.fuel_included
      ? `<span class="item">⛽ <b>Drivstoff inkl.</b></span>`
      : `<span class="item neg">⛽ Drivstoff ikke inkl.</span>`);
  }
  if(t.extra_costs_included !== null && t.extra_costs_included !== undefined){
    metaItems.push(t.extra_costs_included
      ? `<span class="item">🛣️ <b>Bom/ferge inkl.</b></span>`
      : `<span class="item neg">🛣️ Bom/ferge ikke inkl.</span>`);
  }

  const feeParts = [];
  if(t.admin_fee) feeParts.push(`${t.admin_fee} kr gebyr`);
  if(t.no_show_fee) feeParts.push(`${t.no_show_fee} kr no-show`);

  return `
  <div class="card" data-source="${esc(t.source)}">
    <div class="card-top">
      <span class="source-tag">${esc(t.source)}</span>
      ${t.deadline ? `<span class="deadline-tag${urgent?' urgent':''}">⏰ frist ${esc(t.deadline)}</span>` : ''}
    </div>
    <div class="route">
      <div class="stop from"><div class="stop-label">${esc(t.from_loc || '?')}</div></div>
      <div class="line"><span class="arrow"></span></div>
      <div class="stop to"><div class="stop-label">${esc(t.to_loc || '?')}</div></div>
    </div>
    <div class="meta">
      ${t.available_from ? `<span class="item">🕐 Hentes <b>${esc(t.available_from)}</b></span>` : ''}
      ${metaItems.join('')}
      ${t.extra_info ? `<span class="item">ℹ️ ${esc(t.extra_info)}</span>` : ''}
    </div>
    <div class="card-bottom">
      <a class="book-link" href="${esc(t.booking_url || '#')}" target="_blank" rel="noopener">Book →</a>
      ${feeParts.length ? `<span class="fee">${esc(feeParts.join(' · '))}</span>` : '<span></span>'}
    </div>
  </div>`;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function resetFilters(){
  state.from = ""; state.to = "";
  document.getElementById('from-select').value = "";
  document.getElementById('to-select').value = "";
  state.sources = new Set(["Hertz","Hjemferd","Leiebilretur"]);
  document.querySelectorAll('.chip[data-source]').forEach(c => c.classList.add('active'));
  render();
}

document.getElementById('from-select').addEventListener('change', e => { state.from = e.target.value; render(); });
document.getElementById('to-select').addEventListener('change', e => { state.to = e.target.value; render(); });
document.getElementById('reset-btn').addEventListener('click', resetFilters);
document.querySelectorAll('.chip[data-source]').forEach(chip => {
  chip.addEventListener('click', () => {
    const src = chip.dataset.source;
    if(state.sources.has(src)){
      if(state.sources.size === 1) return; // ikke la alle bli skrudd av
      state.sources.delete(src);
      chip.classList.remove('active');
    } else {
      state.sources.add(src);
      chip.classList.add('active');
    }
    render();
  });
});

async function load(){
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  try{
    const res = await fetch('data.json?_=' + Date.now());
    if(!res.ok) throw new Error('data.json ikke funnet');
    const data = await res.json();
    state.trips = data.trips || [];
    populateSelects(state.trips);
    render();

    const ageMin = (Date.now() - new Date(data.generated_at).getTime())/60000;
    statusEl.classList.toggle('fresh', ageMin < 20);
    statusEl.classList.toggle('stale', ageMin >= 20);
    statusText.textContent = `oppdatert ${fmtRelative(data.generated_at)}`;
  } catch(err){
    statusText.textContent = 'kunne ikke laste data';
    document.getElementById('list').innerHTML = `
      <div class="empty">
        <div class="big">Ingen data ennå</div>
        <div class="small">Siden trenger minst én kjøring av varsleren (GitHub Actions) før data.json finnes. Sjekk at GitHub Pages er satt opp til å hente fra /docs på main.</div>
      </div>`;
  }
}

load();
</script>
</body>
</html>
