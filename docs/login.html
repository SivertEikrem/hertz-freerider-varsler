<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem("ffr-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Logg inn — Freerider-ruter</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2028%2028%22%3E%3Crect%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%25230b0f14%22/%3E%3Cpath%20d%3D%22M6%2020%20C%2010%2020%2012%208%2020%208%22%20stroke%3D%22%25234c8dff%22%20stroke-width%3D%222.4%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%226%22%20cy%3D%2220%22%20r%3D%222.4%22%20fill%3D%22%2523e7ecf2%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%228%22%20r%3D%222.4%22%20fill%3D%22%25234c8dff%22/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;590;620&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-shell">
  <nav class="nav">
    <div class="shell nav-row">
      <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 28 28" width="26" height="26" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="var(--surface-raised)" />
        <path d="M6 20 C 10 20 12 8 20 8" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round" />
        <circle cx="6" cy="20" r="2.4" fill="var(--ink)" />
        <circle cx="20" cy="8" r="2.4" fill="var(--accent)" />
      </svg>
      <span class="brand-text">Freerider-ruter</span>
    </a>
      <div></div>
      <div class="nav-actions">
        <button type="button" id="themeToggleBtn" class="theme-toggle-btn" aria-label="Bytt tema"></button>
        <a class="btn btn-secondary btn-small" href="index.html">Tilbake</a>
      </div>
    </div>
  </nav>

  <div class="auth-center">
    <div class="auth-card">
      <h1 id="cardTitle">Velkommen tilbake</h1>
      <p class="sub" id="cardSub">Logg inn for å se rutene dine</p>

      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active">Logg inn</button>
        <button type="button" id="tabSignup">Opprett konto</button>
      </div>

      <div id="authStatus" class="auth-status"></div>

      <form id="authForm">
        <div class="field">
          <label for="email">E-post</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Passord</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Logg inn</button>
      </form>

      <p class="auth-foot" id="switchHint">
        Har du ikke konto? <a href="#" id="switchLink">Opprett en</a>
      </p>
    </div>
  </div>
</div>

<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  let mode = new URLSearchParams(window.location.search).get("mode") === "signup" ? "signup" : "login";

  const tabLogin = document.getElementById("tabLogin");
  const tabSignup = document.getElementById("tabSignup");
  const cardTitle = document.getElementById("cardTitle");
  const cardSub = document.getElementById("cardSub");
  const submitBtn = document.getElementById("submitBtn");
  const switchHint = document.getElementById("switchHint");
  const switchLink = document.getElementById("switchLink");
  const statusBox = document.getElementById("authStatus");
  const passwordInput = document.getElementById("password");

  function applyMode() {
    if (mode === "signup") {
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      cardTitle.textContent = "Opprett konto";
      cardSub.textContent = "Gratis, tar under et minutt";
      submitBtn.textContent = "Opprett konto";
      switchHint.innerHTML = 'Har du allerede konto? <a href="#" id="switchLink">Logg inn</a>';
      passwordInput.setAttribute("autocomplete", "new-password");
    } else {
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      cardTitle.textContent = "Velkommen tilbake";
      cardSub.textContent = "Logg inn for å se rutene dine";
      submitBtn.textContent = "Logg inn";
      switchHint.innerHTML = 'Har du ikke konto? <a href="#" id="switchLink">Opprett en</a>';
      passwordInput.setAttribute("autocomplete", "current-password");
    }
    document.getElementById("switchLink").addEventListener("click", (e) => {
      e.preventDefault();
      mode = mode === "signup" ? "login" : "signup";
      applyMode();
    });
    hideStatus();
  }

  tabLogin.addEventListener("click", () => { mode = "login"; applyMode(); });
  tabSignup.addEventListener("click", () => { mode = "signup"; applyMode(); });

  function showStatus(text, kind) {
    statusBox.textContent = text;
    statusBox.className = "auth-status show " + kind;
  }
  function hideStatus() {
    statusBox.className = "auth-status";
  }

  document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideStatus();
    submitBtn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    try {
      if (mode === "signup") {
        const redirectTo = window.location.href.replace(/login\.html.*$/, "verified.html");
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirectTo } });
        if (error) throw error;
        if (data.session) {
          window.location.href = "app.html";
        } else {
          showStatus("Konto opprettet! Sjekk e-posten din for å bekrefte kontoen, og logg deretter inn.", "success");
          mode = "login";
          applyMode();
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "app.html";
      }
    } catch (err) {
      showStatus(err.message || "Noe gikk galt. Prøv igjen.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  applyMode();

  // Hvis allerede innlogget (og økten faktisk er gyldig), hopp rett til app
  sb.auth.getUser().then(({ data, error }) => {
    if (!error && data.user) window.location.href = "app.html";
  });
</script>

</body>
</html>
