<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>E-post bekreftet — Freerider-ruter</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2028%2028%22%3E%3Crect%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%25230b0f14%22/%3E%3Cpath%20d%3D%22M6%2020%20C%2010%2020%2012%208%2020%208%22%20stroke%3D%22%25234c8dff%22%20stroke-width%3D%222.4%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%226%22%20cy%3D%2220%22%20r%3D%222.4%22%20fill%3D%22%2523e7ecf2%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%228%22%20r%3D%222.4%22%20fill%3D%22%25234c8dff%22/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;590;620&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-shell">
  <nav class="nav">
    <div class="shell nav-row">
      <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 28 28" width="26" height="26" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="var(--surface-raised)" />
        <path d="M6 20 C 10 20 12 8 20 8" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round" />
        <circle cx="6" cy="20" r="2.4" fill="var(--ink)" />
        <circle cx="20" cy="8" r="2.4" fill="var(--accent)" />
      </svg>
      <span class="brand-text">Freerider-ruter</span>
    </a>
      <div></div>
      <div></div>
    </div>
  </nav>

  <div class="auth-center">
    <div class="auth-card" style="text-align:center; max-width: 420px;">

      <div id="checkingState">
        <h1>Bekrefter …</h1>
        <p class="sub">Et øyeblikk.</p>
      </div>

      <div id="successState" style="display:none;">
        <svg viewBox="0 0 64 64" width="56" style="margin: 0 auto 20px;" role="img" aria-hidden="true">
          <circle cx="32" cy="32" r="30" class="illo-stroke illo-available" stroke-width="2" />
          <path d="M20 33 L28 41 L45 23" class="illo-stroke illo-available" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h1>E-posten din er bekreftet</h1>
        <p class="sub">Du er nå logget inn.</p>
        <a class="btn btn-primary btn-block" href="app.html">Gå til dine ruter</a>
      </div>

      <div id="errorState" style="display:none;">
        <h1>Fikk ikke bekreftet</h1>
        <p class="sub">Lenken kan være utløpt eller allerede brukt.</p>
        <a class="btn btn-secondary btn-block" href="login.html">Til innlogging</a>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  // supabase-js leser automatisk access_token fra URL-en (etter #) og
  // oppretter en økt av den, så vi trenger bare å sjekke om det lyktes.
  (async () => {
    const { data, error } = await sb.auth.getSession();

    document.getElementById("checkingState").style.display = "none";

    if (error || !data.session) {
      document.getElementById("errorState").style.display = "block";
      return;
    }

    document.getElementById("successState").style.display = "block";
    setTimeout(() => { window.location.href = "app.html"; }, 2500);
  })();
</script>

</body>
</html>
