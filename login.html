<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logg inn — Freerider-ruter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;590;620&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-shell">
  <nav class="nav">
    <div class="shell nav-row">
      <a class="brand" href="index.html">Free<span class="accent">rider</span>-ruter</a>
      <div></div>
      <div class="nav-actions">
        <a class="btn btn-secondary btn-small" href="index.html">Tilbake</a>
      </div>
    </div>
  </nav>

  <div class="auth-center">
    <div class="auth-card">
      <h1 id="cardTitle">Velkommen tilbake</h1>
      <p class="sub" id="cardSub">Logg inn for å se rutene dine</p>

      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active">Logg inn</button>
        <button type="button" id="tabSignup">Opprett konto</button>
      </div>

      <div id="authStatus" class="auth-status"></div>

      <form id="authForm">
        <div class="field">
          <label for="email">E-post</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Passord</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Logg inn</button>
      </form>

      <p class="auth-foot" id="switchHint">
        Har du ikke konto? <a href="#" id="switchLink">Opprett en</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  let mode = new URLSearchParams(window.location.search).get("mode") === "signup" ? "signup" : "login";

  const tabLogin = document.getElementById("tabLogin");
  const tabSignup = document.getElementById("tabSignup");
  const cardTitle = document.getElementById("cardTitle");
  const cardSub = document.getElementById("cardSub");
  const submitBtn = document.getElementById("submitBtn");
  const switchHint = document.getElementById("switchHint");
  const switchLink = document.getElementById("switchLink");
  const statusBox = document.getElementById("authStatus");
  const passwordInput = document.getElementById("password");

  function applyMode() {
    if (mode === "signup") {
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      cardTitle.textContent = "Opprett konto";
      cardSub.textContent = "Gratis, tar under et minutt";
      submitBtn.textContent = "Opprett konto";
      switchHint.innerHTML = 'Har du allerede konto? <a href="#" id="switchLink">Logg inn</a>';
      passwordInput.setAttribute("autocomplete", "new-password");
    } else {
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      cardTitle.textContent = "Velkommen tilbake";
      cardSub.textContent = "Logg inn for å se rutene dine";
      submitBtn.textContent = "Logg inn";
      switchHint.innerHTML = 'Har du ikke konto? <a href="#" id="switchLink">Opprett en</a>';
      passwordInput.setAttribute("autocomplete", "current-password");
    }
    document.getElementById("switchLink").addEventListener("click", (e) => {
      e.preventDefault();
      mode = mode === "signup" ? "login" : "signup";
      applyMode();
    });
    hideStatus();
  }

  tabLogin.addEventListener("click", () => { mode = "login"; applyMode(); });
  tabSignup.addEventListener("click", () => { mode = "signup"; applyMode(); });

  function showStatus(text, kind) {
    statusBox.textContent = text;
    statusBox.className = "auth-status show " + kind;
  }
  function hideStatus() {
    statusBox.className = "auth-status";
  }

  document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideStatus();
    submitBtn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    try {
      if (mode === "signup") {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          window.location.href = "app.html";
        } else {
          showStatus("Konto opprettet! Sjekk e-posten din for å bekrefte kontoen, og logg deretter inn.", "success");
          mode = "login";
          applyMode();
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "app.html";
      }
    } catch (err) {
      showStatus(err.message || "Noe gikk galt. Prøv igjen.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  applyMode();

  // Hvis allerede innlogget, hopp rett til app
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "app.html";
  });
</script>

</body>
</html>
